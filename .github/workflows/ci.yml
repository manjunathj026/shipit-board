name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests with coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=1.0.${{ github.run_number }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t shipit-board:${{ github.sha }} .

      - name: Start the container
        run: docker run -d --name shipit -p 8000:8000 -e ENVIRONMENT=ci shipit-board:${{ github.sha }}

      - name: Wait until the app is healthy
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/health; then
              echo ""
              echo "Container is healthy"
              exit 0
            fi
            echo "Not ready yet (attempt $i), waiting..."
            sleep 2
          done
          echo "Container never became healthy. Its logs:"
          docker logs shipit
          exit 1

      - name: Check the right version is running
        run: |
          curl -fs http://localhost:8000/api/info
          echo ""
          curl -fs http://localhost:8000/api/info | grep "${GITHUB_SHA::7}"